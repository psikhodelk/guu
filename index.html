<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БИЗНЕС-ВЫЖИВАЛИТИ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px 120px 15px;
        }
        .header {
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 80px 1fr 80px;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 25px;
            padding: 0 5px;
        }
        .btn-month {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            text-align: center;
        }
        .title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-align: center;
        }
        .quarter-indicator {
            width: 100%;
            max-width: 500px;
            text-align: right;
            color: #ff5c5c;
            font-size: 15px;
            margin-bottom: 15px;
            padding-right: 5px;
            font-weight: 500;
        }
        .quarter-indicator::before {
            content: "• ";
            font-size: 18px;
        }
        .companies-list {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background-color: #111111;
        }
        .company-card {
            background-color: #121212;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid #1a1a1a;
        }
        .company-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
        }
        .company-name {
            font-size: 15px;
            font-weight: 400;
            color: #e0e0e0;
            max-width: 70%;
            flex-grow: 1;
        }
        .company-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .status-text {
            font-size: 13px;
            color: #888888;
        }
        .status-text.done {
            color: #00cc66;
            font-weight: bold;
        }
        .btn-plus {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #ff9f43;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .btn-plus.open {
            transform: rotate(45deg);
            color: #ff5c5c;
        }
        .indicators-panel {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background-color: #181818;
            border-radius: 8px;
            border: 1px solid #252525;
            flex-direction: column;
            gap: 12px;
        }
        .indicators-panel.active {
            display: flex;
        }
        .indicators-history-box {
            background-color: #222222;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 12px;
            color: #ff9f43;
            border: 1px dashed #333;
        }
        .history-title {
            font-weight: bold;
            margin-bottom: 6px;
            color: #888888;
            font-size: 11px;
            text-transform: uppercase;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .input-group label {
            font-size: 14px;
            color: #aaa;
        }
        .input-group input {
            background-color: #222;
            border: 1px solid #333;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            width: 90px;
            text-align: center;
            font-size: 14px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #ff9f43;
        }
        .btn-save-inputs {
            background-color: #ff9f43;
            color: #000;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-action-container {
            width: 100%;
            max-width: 500px;
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }
        .btn-submit-quarter {
            background: linear-gradient(135deg, #ff9f43, #ff5c5c);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 90%;
            box-shadow: 0 4px 15px rgba(255, 159, 67, 0.2);
        }
        .results-screen {
            display: none;
            width: 100%;
            max-width: 500px;
            background-color: #121212;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #222;
            margin-top: 10px;
        }
        .results-title {
            text-align: center;
            color: #ff9f43;
            font-size: 20px;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .rating-table {
            width: 100%;
            border-collapse: collapse;
        }
        .rating-table th {
            text-align: left;
            color: #888;
            font-size: 13px;
            padding-bottom: 12px;
            border-bottom: 1px solid #222;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .rating-table td {
            padding: 16px 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 15px;
            vertical-align: middle;
        }
        .rank-medal {
            font-size: 20px;
            display: inline-block;
            width: 35px;
            text-align: center;
        }
        .rank-num {
            font-weight: bold;
            color: #ff5c5c;
            display: inline-block;
            width: 35px;
            text-align: center;
        }
        .score-val {
            text-align: right;
            font-weight: 600;
            color: #00cc66;
            font-size: 16px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background-color: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            display: flex;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #888888;
            text-decoration: none;
            font-size: 12px;
            padding: 10px 0;
            border-radius: 30px;
            cursor: pointer;
        }
        .nav-item.active {
            background-color: #121212;
            color: #ff9f43;
        }
        .nav-icon {
            font-size: 18px;
        }
        html, body {
            overscroll-behavior-y: contain;
        }
    </style>
</head>
<body>

    <div id="lobby-panel" style="max-width: 500px; padding: 20px; width: 100%; display: block;">
        <h2 style="text-align: center; margin-bottom: 20px; color: #ff9f43;">Мои игры</h2>
        <div onclick="showScreen('game')" style="background: #121212; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #222; cursor: pointer;">
            <div style="font-weight: bold;">Бизнес-Выживалити #1</div>
            <div style="color: #888; font-size: 13px; margin-top: 5px;">Статус: В процессе (<span id="lobby-quarter-text">Квартал 1</span>)</div>
        </div>
        <button style="background: #ff9f43; color: #000; border: none; padding: 15px; border-radius: 25px; width: 100%; font-weight: bold; cursor: pointer;" onclick="startNewGame()">Начать новую игру</button>
    </div>

    <div id="game-panel" style="width: 100%; display: none; flex-direction: column; align-items: center;">
        <div class="header">
            <button class="btn-month" id="current-date"></button>
            <div class="title">БИЗНЕС-ВЫЖИВАЛИТИ</div>
            <div style="width: 80px;"></div>
        </div>
        <div class="quarter-indicator" id="quarter-text">Квартал 1</div>
        <div class="companies-list" id="companies-container"></div>
        <div class="btn-action-container">
            <button class="btn-submit-quarter" id="action-btn" onclick="submitQuarter()">Подтвердить квартал 1</button>
        </div>
    </div>

    <div class="results-screen" id="results-screen">
        <div class="results-title">🏆 ИТОГИ 🏆</div>
        <table class="rating-table">
            <thead>
                <tr>
                    <th style="width: 60px;"></th>
                    <th>НАЗВАНИЕ КОМАНДЫ</th>
                    <th style="text-align: right; white-space: nowrap;">СУММА БАЛЛОВ</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="showScreen('lobby')">
            <span class="nav-icon">📜</span>
            <span>Главная</span>
        </div>
        <div class="nav-item" onclick="showScreen('game')">
            <span class="nav-icon">⚔️</span>
            <span>Текущая игра</span>
        </div>
    </div>
    <script>

        const companiesData = [
            { id: 0, name: 'IT-стартап „НейроКод“' },
            { id: 1, name: 'Сеть кофеин „Cup & GO“' },
            { id: 2, name: 'Бренд одежды „Aura“' },
            { id: 3, name: 'Логистическая компания „Магистраль“' },
            { id: 4, name: 'Завод эко-упаковки „ГринПак“' },
            { id: 5, name: 'Платформа онлайн-обучения „СкиллМастер“' }
        ];

        let currentQuarter = 1;
        let filledInCurrentQuarter = new Set();

        let scoresHistory = {
            1: {}, 2: {}, 3: {}, 4: {}
        };

        function initScoresStructure() {
            for (let q = 1; q <= 4; q++) {
                for (let id = 0; id <= 5; id++) {
                    scoresHistory[q][id] = { cap: 0, pow: 0, rep: 0, total: 0 };
                }
            }
        }
        initScoresStructure();

        function showScreen(screenId) {
            document.getElementById('game-panel').style.display = 'none';
            document.getElementById('lobby-panel').style.display = 'none';
            if (document.getElementById('results-screen')) {
                document.getElementById('results-screen').style.display = 'none';
            }
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if (screenId === 'lobby') {
                document.getElementById('lobby-panel').style.display = 'block';
                document.querySelector('.nav-item:nth-child(1)').classList.add('active');
            } else {
                document.getElementById('game-panel').style.display = 'flex';
                document.querySelector('.nav-item:nth-child(2)').classList.add('active');
            }
        }
        function renderCompanies() {
            const container = document.getElementById('companies-container');
            if (!container) return;
            container.innerHTML = '';

            companiesData.forEach(company => {
                const isDone = filledInCurrentQuarter.has(company.id);

                let historyHTML = '';
                if (currentQuarter > 1) {
                    historyHTML += '<div class="indicators-history-box">';
                    historyHTML += '<div class="history-title">Ранее внесено:</div>';
                    for (let q = 1; q < currentQuarter; q++) {
                        const hist = scoresHistory[q][company.id] || { cap: 0, pow: 0, rep: 0 };
                        historyHTML += `<div style="margin-bottom: 2px;"><strong>Кв ${q}:</strong> Капитал: ${hist.cap} | Мощность: ${hist.pow} | Репутация: ${hist.rep}</div>`;
                    }
                    historyHTML += '</div>';
                }
                
                const card = document.createElement('div');
                card.className = 'company-card';
                card.innerHTML = `
                    <div class="company-main">
                        <div class="company-name">${company.name}</div>
                        <div class="company-actions">
                            <span class="status-text ${isDone ? 'done' : ''}" id="status-${company.id}">
                                ${isDone ? 'Готово ✓' : 'Внести данные'}
                            </span>
                            <button class="btn-plus" id="btn-plus-${company.id}" onclick="togglePanel(${company.id})">+</button>
                        </div>
                    </div>
                    
                    <div class="indicators-panel" id="panel-${company.id}">
                        ${historyHTML}
                        <div class="input-group">
                            <label>Капитал</label>
                            <input type="number" id="cap-${company.id}" placeholder="0" min="0">
                        </div>
                        <div class="input-group">
                            <label>Мощность</label>
                            <input type="number" id="pow-${company.id}" placeholder="0" min="0">
                        </div>
                        <div class="input-group">
                            <label>Репутация</label>
                            <input type="number" id="rep-${company.id}" placeholder="0" min="0">
                        </div>
                        <button class="btn-save-inputs" onclick="saveIndicators(${company.id})">Сохранить показатели</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function togglePanel(id) {
            const panel = document.getElementById('panel-' + id);
            const btn = document.getElementById('btn-plus-' + id);
            if (panel && btn) {
                panel.classList.toggle('active');
                btn.classList.toggle('open');
            }
        }
        function saveToStorage() {
            localStorage.setItem('business_game_scores_v3', JSON.stringify({
                currentQuarter: currentQuarter,
                scoresHistory: scoresHistory,
                filled: Array.from(filledInCurrentQuarter)
            }));
        }

        function saveIndicators(id) {
            const cap = parseInt(document.getElementById('cap-' + id).value) || 0;
            const pow = parseInt(document.getElementById('pow-' + id).value) || 0;
            const rep = parseInt(document.getElementById('rep-' + id).value) || 0;

            scoresHistory[currentQuarter][id] = {
                cap: cap,
                pow: pow,
                rep: rep,
                total: cap + pow + rep
            };

            filledInCurrentQuarter.add(id);
            togglePanel(id);
            
            const statusText = document.getElementById('status-' + id);
            if (statusText) {
                statusText.textContent = 'Готово ✓';
                statusText.classList.add('done');
            }
            saveToStorage();
        }

        function submitQuarter() {
            if (filledInCurrentQuarter.size < 6) {
                alert('Пожалуйста, внесите показатели для всех 6 секторов перед переходом!');
                return;
            }
            if (currentQuarter < 4) {
                currentQuarter++;
                filledInCurrentQuarter.clear(); 
                document.getElementById('quarter-text').textContent = 'Квартал ' + currentQuarter;
                document.getElementById('lobby-quarter-text').textContent = 'Квартал ' + currentQuarter;
                
                const actionBtn = document.getElementById('action-btn');
                if (currentQuarter === 4) {
                    actionBtn.textContent = 'Подвести итоги';
                } else {
                    actionBtn.textContent = 'Подтвердить квартал ' + currentQuarter;
                }
                renderCompanies();
                saveToStorage();
                window.scrollTo(0, 0);
            } else {
                showFinalLeaderboard();
            }
        }
        function showFinalLeaderboard() {
            document.getElementById('game-panel').style.display = 'none';
            const resultsScreen = document.getElementById('results-screen');
            resultsScreen.style.display = 'block';

            const sortedLeaderboard = companiesData.map(c => {
                const q4Data = scoresHistory[4][c.id] || { total: 0 };
                return {
                    name: c.name,
                    q4Total: q4Data.total
                };
            }).sort((a, b) => b.q4Total - a.q4Total);

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            sortedLeaderboard.forEach((item, index) => {
                const place = index + 1;
                let badge = '';

                if (place === 1) badge = '<span class="rank-medal">🥇</span>';
                else if (place === 2) badge = '<span class="rank-medal">🥈</span>';
                else if (place === 3) badge = '<span class="rank-medal">🥉</span>';
                else badge = '<span class="rank-num">#' + place + '</span>';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${badge}</td>
                    <td><div style="font-weight: 500; color: #e0e0e0;">${item.name}</div></td>
                    <td class="score-val">${item.q4Total}</td>
                `;
                tbody.appendChild(row);
            });

            localStorage.removeItem('business_game_scores_v3');
        }

        function startNewGame() {
            localStorage.removeItem('business_game_scores_v3');
            currentQuarter = 1;
            filledInCurrentQuarter.clear();
            initScoresStructure();

            document.getElementById('quarter-text').textContent = 'Квартал 1';
            document.getElementById('lobby-quarter-text').textContent = 'Квартал 1';
            document.getElementById('action-btn').textContent = 'Подтвердить квартал 1';
            
            renderCompanies();
            showScreen('game');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('business_game_scores_v3');
            if (savedData) {
                const parsed = JSON.parse(savedData);
                currentQuarter = parsed.currentQuarter;
                scoresHistory = parsed.scoresHistory;
                filledInCurrentQuarter = new Set(parsed.filled);
                
                document.getElementById('quarter-text').textContent = 'Квартал ' + currentQuarter;
                document.getElementById('lobby-quarter-text').textContent = 'Квартал ' + currentQuarter;
                
                const actionBtn = document.getElementById('action-btn');
                if (currentQuarter === 4) {
                    actionBtn.textContent = 'Подвести итоги';
                } else {
                    actionBtn.textContent = 'Подтвердить квартал ' + currentQuarter;
                }
            }

            renderCompanies();

            document.getElementById('current-date').textContent = new Date().toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'});

            showScreen('lobby');
        });
    </script>
</body>
</html>
